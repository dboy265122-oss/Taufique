<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Palette Generator — SK Taufique Hossain</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#03040a;--surface:#080d1a;--card:#0c1220;--border:rgba(255,255,255,.07);--cyan:#22d3ee;--violet:#a78bfa;--white:#e8f0ff;--muted:#4b5a7a;--ff:'Space Grotesk',system-ui;--mono:'Space Mono',monospace}
body{background:var(--bg);color:var(--white);font-family:var(--ff);min-height:100vh;-webkit-font-smoothing:antialiased}
nav{padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(3,4,10,.9);backdrop-filter:blur(20px);z-index:10}
.logo{font-family:var(--mono);color:var(--cyan);font-size:.82rem;letter-spacing:.08em;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--border);border-radius:6px;font-size:.8rem;color:var(--muted);text-decoration:none;transition:all .2s}
.back:hover{border-color:var(--cyan);color:var(--cyan)}
main{max-width:900px;margin:0 auto;padding:60px 24px}
.hero{text-align:center;margin-bottom:56px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid rgba(34,211,238,.25);border-radius:100px;font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;color:var(--cyan);margin-bottom:20px}
h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:700;letter-spacing:-.03em;margin-bottom:12px}
.gr{background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--muted);font-size:.95rem;line-height:1.7}
/* Controls */
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:48px}
.btn-gen{padding:12px 28px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--bg);border:none;border-radius:8px;font-family:var(--ff);font-weight:700;font-size:.9rem;cursor:pointer;transition:opacity .2s,transform .2s}
.btn-gen:hover{opacity:.88;transform:translateY(-2px)}
.btn-sec{padding:12px 22px;background:var(--card);border:1px solid var(--border);color:var(--white);border-radius:8px;font-family:var(--ff);font-size:.88rem;cursor:pointer;transition:all .2s}
.btn-sec:hover{border-color:var(--violet)}
select{padding:11px 16px;background:var(--card);border:1px solid var(--border);color:var(--white);border-radius:8px;font-family:var(--mono);font-size:.78rem;outline:none;cursor:pointer}
/* Palette Grid */
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:16px;overflow:hidden;border:1px solid var(--border);margin-bottom:24px;min-height:220px}
.color-block{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px 8px;cursor:pointer;transition:flex .3s ease;position:relative;min-height:220px}
.color-block:hover{flex:1.6}
.color-block:hover .cbottom{opacity:1;transform:translateY(0)}
.cbottom{opacity:0;transform:translateY(8px);transition:all .25s;text-align:center;background:rgba(0,0,0,.5);border-radius:8px;padding:8px 12px;width:100%;backdrop-filter:blur(8px)}
.chex{font-family:var(--mono);font-size:.75rem;color:#fff;font-weight:700;margin-bottom:4px}
.cname{font-size:.65rem;color:rgba(255,255,255,.7);margin-bottom:8px}
.ccopy{padding:4px 12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:100px;font-size:.65rem;font-family:var(--mono);color:#fff;cursor:pointer;transition:background .2s;width:100%}
.ccopy:hover{background:rgba(255,255,255,.3)}
/* Saved Palettes */
.saved-title{font-family:var(--mono);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--violet);margin-bottom:16px}
.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.saved-pal{border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s}
.saved-pal:hover{border-color:rgba(167,139,250,.4);transform:translateY(-2px)}
.saved-colors{display:flex;height:48px}
.saved-colors div{flex:1}
.saved-label{padding:10px 12px;background:var(--card);font-size:.72rem;color:var(--muted);font-family:var(--mono)}
/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid rgba(34,211,238,.3);color:var(--cyan);padding:10px 22px;border-radius:100px;font-family:var(--mono);font-size:.78rem;transition:transform .3s ease;z-index:100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;padding:40px 24px;border-top:1px solid var(--border);margin-top:64px;font-size:.78rem;color:var(--muted)}
footer span{color:var(--cyan)}
@media(max-width:600px){.palette{grid-template-columns:repeat(5,1fr)}.color-block{min-height:160px}}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="logo">SK_TAUFIQUE.DEV</a>
  <a href="../index.html" class="back">← Back to Portfolio</a>
</nav>
<main>
  <div class="hero">
    <div class="badge">🎨 PROJECT · LIVE DEMO</div>
    <h1>Color Palette<br><span class="gr">Generator</span></h1>
    <p class="sub">Generate beautiful color palettes instantly. Click any color to copy its hex code.</p>
  </div>
  <div class="controls">
    <button class="btn-gen" onclick="generate()">✦ Generate Palette</button>
    <select id="mode" onchange="generate()">
      <option value="random">Random</option>
      <option value="analogous">Analogous</option>
      <option value="complementary">Complementary</option>
      <option value="triadic">Triadic</option>
      <option value="dark">Dark Tones</option>
      <option value="pastel">Pastel</option>
      <option value="neon">Neon</option>
    </select>
    <button class="btn-sec" onclick="savePalette()">💾 Save Palette</button>
  </div>
  <div class="palette" id="palette"></div>
  <div id="saved-section" style="display:none;margin-top:48px">
    <div class="saved-title">/ SAVED PALETTES</div>
    <div class="saved-grid" id="saved-grid"></div>
  </div>
</main>
<div class="toast" id="toast">Copied!</div>
<footer>Built by <span>SK Taufique Hossain</span> · <a href="../index.html" style="color:var(--violet);text-decoration:none">View Portfolio</a></footer>

<script>
var current = [];
var saved = [];

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  var a = s * Math.min(l, 1 - l);
  function f(n) {
    var k = (n + h / 30) % 12;
    var color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  }
  return '#' + f(0) + f(8) + f(4);
}

function hexToName(hex) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  var h = Math.max(r,g,b), l = Math.min(r,g,b);
  if (h - l < 30) return r > 200 ? 'White' : r < 50 ? 'Black' : 'Gray';
  var hue = (h === r ? (g - b)/(h-l) : h === g ? 2+(b-r)/(h-l) : 4+(r-g)/(h-l)) * 60;
  if (hue < 0) hue += 360;
  if (hue < 30) return 'Red'; if (hue < 60) return 'Orange'; if (hue < 90) return 'Yellow';
  if (hue < 150) return 'Green'; if (hue < 210) return 'Cyan'; if (hue < 270) return 'Blue';
  if (hue < 330) return 'Violet'; return 'Pink';
}

function generate() {
  var mode = document.getElementById('mode').value;
  var colors = [];
  var baseH = Math.random() * 360;
  if (mode === 'random') {
    for (var i = 0; i < 5; i++) colors.push(hslToHex(Math.random()*360, 50+Math.random()*40, 35+Math.random()*35));
  } else if (mode === 'analogous') {
    for (var i = 0; i < 5; i++) colors.push(hslToHex((baseH + i*22) % 360, 55+Math.random()*20, 40+Math.random()*20));
  } else if (mode === 'complementary') {
    for (var i = 0; i < 5; i++) {
      var h = i < 3 ? baseH + i*15 : (baseH+180) % 360 + (i-3)*15;
      colors.push(hslToHex(h % 360, 60+Math.random()*20, 38+Math.random()*22));
    }
  } else if (mode === 'triadic') {
    var bases = [baseH, (baseH+120)%360, (baseH+240)%360, (baseH+60)%360, (baseH+180)%360];
    bases.forEach(function(h) { colors.push(hslToHex(h, 60, 45+Math.random()*15)); });
  } else if (mode === 'dark') {
    for (var i = 0; i < 5; i++) colors.push(hslToHex((baseH+i*30)%360, 40+Math.random()*30, 12+Math.random()*22));
  } else if (mode === 'pastel') {
    for (var i = 0; i < 5; i++) colors.push(hslToHex((baseH+i*35)%360, 40+Math.random()*20, 72+Math.random()*15));
  } else if (mode === 'neon') {
    for (var i = 0; i < 5; i++) colors.push(hslToHex((baseH+i*45)%360, 90+Math.random()*10, 50+Math.random()*15));
  }
  current = colors;
  render(colors);
}

function render(colors) {
  var pal = document.getElementById('palette');
  pal.innerHTML = '';
  colors.forEach(function(hex) {
    var div = document.createElement('div');
    div.className = 'color-block';
    div.style.background = hex;
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    var lum = (0.299*r + 0.587*g + 0.114*b)/255;
    div.innerHTML = '<div class="cbottom"><div class="chex">' + hex.toUpperCase() + '</div><div class="cname">' + hexToName(hex) + '</div><button class="ccopy" onclick="copyHex(event,\'' + hex + '\')">Copy</button></div>';
    pal.appendChild(div);
  });
}

function copyHex(e, hex) {
  e.stopPropagation();
  navigator.clipboard.writeText(hex.toUpperCase()).catch(function() {
    var el = document.createElement('textarea');
    el.value = hex.toUpperCase();
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  });
  showToast('Copied ' + hex.toUpperCase());
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}

function savePalette() {
  if (!current.length) return;
  saved.unshift(current.slice());
  if (saved.length > 8) saved.pop();
  renderSaved();
  showToast('Palette saved!');
}

function renderSaved() {
  var sec = document.getElementById('saved-section');
  var grid = document.getElementById('saved-grid');
  if (!saved.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  grid.innerHTML = '';
  saved.forEach(function(pal, idx) {
    var div = document.createElement('div');
    div.className = 'saved-pal';
    div.onclick = function() { current = pal; render(pal); };
    var colors = pal.map(function(c) { return '<div style="background:' + c + '"></div>'; }).join('');
    div.innerHTML = '<div class="saved-colors">' + colors + '</div><div class="saved-label">Palette ' + (saved.length - idx) + '</div>';
    grid.appendChild(div);
  });
}

generate();
</script>
</body>
</html>
