<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Test — SK Taufique Hossain</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#03040a;--surface:#080d1a;--card:#0c1220;--border:rgba(255,255,255,.07);--cyan:#22d3ee;--violet:#a78bfa;--white:#e8f0ff;--muted:#4b5a7a;--ff:'Space Grotesk',system-ui;--mono:'Space Mono',monospace}
body{background:var(--bg);color:var(--white);font-family:var(--ff);min-height:100vh;-webkit-font-smoothing:antialiased}
nav{padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(3,4,10,.9);backdrop-filter:blur(20px);z-index:10}
.logo{font-family:var(--mono);color:var(--cyan);font-size:.82rem;letter-spacing:.08em;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--border);border-radius:6px;font-size:.8rem;color:var(--muted);text-decoration:none;transition:all .2s}
.back:hover{border-color:var(--cyan);color:var(--cyan)}
main{max-width:800px;margin:0 auto;padding:60px 24px}
.hero{text-align:center;margin-bottom:48px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid rgba(34,211,238,.25);border-radius:100px;font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;color:var(--cyan);margin-bottom:20px}
h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:700;letter-spacing:-.03em;margin-bottom:12px}
.gr{background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--muted);font-size:.95rem;line-height:1.7}
/* Stats Bar */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-n{font-family:var(--mono);font-size:1.6rem;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-l{font-size:.68rem;color:var(--muted);margin-top:6px;letter-spacing:.05em}
/* Mode Selector */
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.mode-btn{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:100px;font-family:var(--mono);font-size:.72rem;color:var(--muted);cursor:pointer;transition:all .2s}
.mode-btn.active,.mode-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.06)}
/* Text Display */
.text-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 32px;margin-bottom:20px;font-family:var(--mono);font-size:1.1rem;line-height:1.9;letter-spacing:.02em;min-height:100px;cursor:text;position:relative;user-select:none}
.char{display:inline}
.char.correct{color:var(--cyan)}
.char.wrong{color:#f87171;background:rgba(248,113,113,.1);border-radius:2px}
.char.current{border-bottom:2px solid var(--violet);animation:blink .8s infinite}
.char.pending{color:var(--muted)}
@keyframes blink{0%,100%{border-color:var(--violet)}50%{border-color:transparent}}
/* Input */
.input-area{position:relative;margin-bottom:24px}
#typeInput{width:100%;padding:14px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--white);font-family:var(--mono);font-size:1rem;outline:none;transition:border-color .2s;caret-color:var(--violet)}
#typeInput:focus{border-color:var(--violet)}
#typeInput::placeholder{color:var(--muted)}
/* Controls */
.ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-restart{padding:12px 28px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--bg);border:none;border-radius:8px;font-family:var(--ff);font-weight:700;font-size:.9rem;cursor:pointer;transition:opacity .2s,transform .2s}
.btn-restart:hover{opacity:.88;transform:translateY(-2px)}
/* Result */
.result{display:none;background:var(--card);border:1px solid rgba(34,211,238,.25);border-radius:16px;padding:32px;text-align:center;margin-bottom:28px}
.result h2{font-size:1.8rem;font-weight:700;margin-bottom:8px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
.result-stat .n{font-family:var(--mono);font-size:1.8rem;font-weight:700;color:var(--cyan)}
.result-stat .l{font-size:.72rem;color:var(--muted);margin-top:4px}
.progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:4px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:2px;width:0%;transition:width .3s}
footer{text-align:center;padding:40px 24px;border-top:1px solid var(--border);margin-top:64px;font-size:.78rem;color:var(--muted)}
footer span{color:var(--cyan)}
@media(max-width:600px){.stats-bar{grid-template-columns:repeat(2,1fr)}.result-grid{grid-template-columns:repeat(2,1fr)}.text-box{font-size:.92rem;padding:20px}}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="logo">SK_TAUFIQUE.DEV</a>
  <a href="../index.html" class="back">← Back to Portfolio</a>
</nav>
<main>
  <div class="hero">
    <div class="badge">⌨️ PROJECT · LIVE DEMO</div>
    <h1>Typing Speed<br><span class="gr">Test</span></h1>
    <p class="sub">Test your typing speed and accuracy. Choose a mode and start typing!</p>
  </div>
  <div class="stats-bar">
    <div class="stat"><div class="stat-n" id="wpm">0</div><div class="stat-l">WPM</div></div>
    <div class="stat"><div class="stat-n" id="acc">100%</div><div class="stat-l">ACCURACY</div></div>
    <div class="stat"><div class="stat-n" id="timer">60</div><div class="stat-l">SECONDS</div></div>
    <div class="stat"><div class="stat-n" id="errors">0</div><div class="stat-l">ERRORS</div></div>
  </div>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <div class="modes">
    <button class="mode-btn active" onclick="setMode('60','this')">60s</button>
    <button class="mode-btn" onclick="setMode('30','this')">30s</button>
    <button class="mode-btn" onclick="setMode('15','this')">15s</button>
    <button class="mode-btn" onclick="setMode('code','this')">Code</button>
    <button class="mode-btn" onclick="setMode('quotes','this')">Quotes</button>
  </div>
  <div class="text-box" id="textBox" onclick="document.getElementById('typeInput').focus()"></div>
  <div class="input-area">
    <input type="text" id="typeInput" placeholder="Click here or on the text above to start typing..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="result" id="result">
    <h2>Test Complete! 🎉</h2>
    <div class="result-grid">
      <div class="result-stat"><div class="n" id="r-wpm">0</div><div class="l">WPM</div></div>
      <div class="result-stat"><div class="n" id="r-acc">0%</div><div class="l">Accuracy</div></div>
      <div class="result-stat"><div class="n" id="r-err">0</div><div class="l">Errors</div></div>
    </div>
  </div>
  <div class="ctrl">
    <button class="btn-restart" onclick="restart()">↺ Restart Test</button>
  </div>
</main>
<footer>Built by <span>SK Taufique Hossain</span> · <a href="../index.html" style="color:var(--violet);text-decoration:none">View Portfolio</a></footer>

<script>
var TEXTS = {
  '60': [
    "the quick brown fox jumps over the lazy dog and the fox was very happy about it because it is a great exercise for the mind and body",
    "programming is the art of telling another human what one wants the computer to do and making sure the computer understands it perfectly",
    "success is not final failure is not fatal it is the courage to continue that counts and every day is a new opportunity to grow",
    "the only way to do great work is to love what you do and if you have not found it yet keep looking and never settle for less",
  ],
  '30': [
    "the best time to plant a tree was twenty years ago the second best time is today so start now",
    "code is like humor when you have to explain it it is not that good write clean code always",
    "first solve the problem then write the code and make sure your solution is elegant and efficient",
  ],
  '15': [
    "keep it simple and focused on the task at hand",
    "fast fingers fast mind sharp code clean results",
    "the faster you type the more you can build today",
  ],
  'code': [
    "const sum = (a, b) => a + b; const result = sum(10, 20); console.log(result);",
    "function fibonacci(n) { if (n <= 1) return n; return fibonacci(n-1) + fibonacci(n-2); }",
    "const arr = [1, 2, 3, 4, 5]; const doubled = arr.map(x => x * 2); console.log(doubled);",
  ],
  'quotes': [
    "any fool can write code that a computer can understand but good programmers write code that humans can understand",
    "first make it work then make it right then make it fast that is the order of priority in software development",
    "the most important skill for a programmer is the ability to break a big problem into smaller manageable pieces",
  ]
};

var mode = '60', timeLimit = 60;
var text = '', chars = [], idx = 0, started = false, finished = false;
var timerInterval, timeLeft, totalTyped = 0, errors = 0;

function setMode(m, el) {
  mode = m;
  timeLimit = isNaN(parseInt(m)) ? 60 : parseInt(m);
  document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
  if (el !== 'this') document.querySelectorAll('.mode-btn').forEach(function(b) { if (b.textContent.toLowerCase().includes(m)) b.classList.add('active'); });
  restart();
}

function restart() {
  clearInterval(timerInterval);
  var arr = TEXTS[mode] || TEXTS['60'];
  text = arr[Math.floor(Math.random() * arr.length)];
  chars = text.split('');
  idx = 0; started = false; finished = false; totalTyped = 0; errors = 0;
  timeLeft = timeLimit;
  document.getElementById('wpm').textContent = '0';
  document.getElementById('acc').textContent = '100%';
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('errors').textContent = '0';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('typeInput').value = '';
  document.getElementById('typeInput').disabled = false;
  document.getElementById('result').style.display = 'none';
  renderText();
}

function renderText() {
  var box = document.getElementById('textBox');
  box.innerHTML = chars.map(function(c, i) {
    var cls = 'pending';
    if (i < idx) cls = 'correct';
    if (i === idx) cls = 'current';
    return '<span class="char ' + cls + '">' + (c === ' ' ? '&nbsp;' : c) + '</span>';
  }).join('');
}

function updateStats() {
  var elapsed = (timeLimit - timeLeft) || 1;
  var wpm = Math.round((idx / 5) / (elapsed / 60));
  var acc = totalTyped === 0 ? 100 : Math.round(((totalTyped - errors) / totalTyped) * 100);
  document.getElementById('wpm').textContent = wpm;
  document.getElementById('acc').textContent = acc + '%';
  document.getElementById('errors').textContent = errors;
  document.getElementById('progress').style.width = ((idx / chars.length) * 100) + '%';
}

function startTimer() {
  timerInterval = setInterval(function() {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    updateStats();
    if (timeLeft <= 0) endTest();
  }, 1000);
}

function endTest() {
  clearInterval(timerInterval);
  finished = true;
  document.getElementById('typeInput').disabled = true;
  var elapsed = timeLimit;
  var wpm = Math.round((idx / 5) / (elapsed / 60));
  var acc = totalTyped === 0 ? 100 : Math.round(((totalTyped - errors) / totalTyped) * 100);
  document.getElementById('r-wpm').textContent = wpm;
  document.getElementById('r-acc').textContent = acc + '%';
  document.getElementById('r-err').textContent = errors;
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('typeInput').addEventListener('input', function(e) {
  if (finished) return;
  if (!started) { started = true; startTimer(); }
  var val = this.value;
  if (!val.length) return;
  var typed = val[val.length - 1];
  totalTyped++;
  if (typed === chars[idx]) {
    idx++;
  } else {
    errors++;
  }
  this.value = '';
  updateStats();
  renderText();
  if (idx >= chars.length) endTest();
});

document.getElementById('typeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') { e.preventDefault(); restart(); }
});

restart();
</script>
</body>
</html>
